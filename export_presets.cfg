; Windows prototype preset. iOS signing is configured after the user's Apple team is known.
[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data.json"
exclude_filter="tests/*,tools/*,docs/*"
export_path="build/windows/Bannerworks.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false
application/product_name="Bannerworks"
application/file_description="Bannerworks prototype"
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
codesign/enable=false

[preset.1]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data.json"
exclude_filter="tests/*,tools/*,docs/*,web/*"
export_path="build/web/index.html"
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page="res://web/offline.html"
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/background_color=Color(0.055, 0.09, 0.12, 1)
